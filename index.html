<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stop watch</title>
</head>
<link rel="stylesheet" href="style.css">

<body>

    <!-- start -->
    <div class="container">
        <!-- <h1><u>STOPWATCH</u></h1> -->
        <div class="display-text"><p>HOUR: MINS: SECS</p></div>
        <div class="no" id="display">00 :00 :00</div>

    </div>
    <div class="btns">
        <button class="st" id="start" onclick="starttimer()">Start</button>
        <button class="sp" id="stop" onclick="stoptimer()">Stop</button>
        <button class="re" id="Reset" onclick="resetTimer()">Reset</button>
    </div>


    <script src="app.js"></script>
</body>

</html>
